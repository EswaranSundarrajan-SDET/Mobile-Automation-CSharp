name: .NET Appium framework CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_browserstack:
        description: Run the opt-in BrowserStack App Automate smoke test
        required: false
        default: false
        type: boolean

jobs:
  build-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore AppiumInterviewFramework.sln
      - name: Build
        run: dotnet build AppiumInterviewFramework.sln --configuration Release --no-restore
      - name: Run configuration checks
        run: dotnet test AppiumInterviewFramework.sln --configuration Release --no-build --filter Category=BuildValidation

  mobile-smoke:
    if: ${{ vars.RUN_APPIUM_TESTS == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore and build
        run: dotnet build AppiumInterviewFramework.sln --configuration Release
      - name: Run Appium smoke test
        env:
          RUN_APPIUM_TESTS: true
          DEMO_APP_USERNAME: ${{ secrets.DEMO_APP_USERNAME }}
          DEMO_APP_PASSWORD: ${{ secrets.DEMO_APP_PASSWORD }}
        run: dotnet test AppiumInterviewFramework.sln --configuration Release --no-build --filter Category=Mobile

  browserstack-smoke:
    if: ${{ vars.RUN_BROWSERSTACK_TESTS == 'true' || inputs.run_browserstack == true }}
    runs-on: ubuntu-latest
    # Required repository secrets: BROWSERSTACK_USERNAME, BROWSERSTACK_ACCESS_KEY,
    # DEMO_APP_USERNAME, and DEMO_APP_PASSWORD. Required repository variable: BROWSERSTACK_APP_URL.
    # Device/OS and metadata variables are optional and fall back to the checked-in safe defaults.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore and build
        run: dotnet build AppiumInterviewFramework.sln --configuration Release
      - name: Validate BrowserStack configuration
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ vars.BROWSERSTACK_APP_URL }}
        run: |
          missing=()
          [[ -z "$BROWSERSTACK_USERNAME" ]] && missing+=(BROWSERSTACK_USERNAME)
          [[ -z "$BROWSERSTACK_ACCESS_KEY" ]] && missing+=(BROWSERSTACK_ACCESS_KEY)
          [[ -z "$BROWSERSTACK_APP_URL" ]] && missing+=(BROWSERSTACK_APP_URL)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::BrowserStack smoke is enabled but these secrets/variables are missing: ${missing[*]}"
            exit 1
          fi
      - name: Run BrowserStack App Automate smoke test
        env:
          RUN_APPIUM_TESTS: true
          BROWSERSTACK_ENABLED: true
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ vars.BROWSERSTACK_APP_URL }}
          BROWSERSTACK_HUB_URL: ${{ vars.BROWSERSTACK_HUB_URL }}
          BROWSERSTACK_DEVICE_NAME: ${{ vars.BROWSERSTACK_DEVICE_NAME }}
          BROWSERSTACK_OS_VERSION: ${{ vars.BROWSERSTACK_OS_VERSION }}
          BROWSERSTACK_PROJECT_NAME: ${{ vars.BROWSERSTACK_PROJECT_NAME }}
          BROWSERSTACK_BUILD_NAME: ${{ vars.BROWSERSTACK_BUILD_NAME }}
          BROWSERSTACK_SESSION_NAME: ${{ vars.BROWSERSTACK_SESSION_NAME }}
          BROWSERSTACK_DEBUG: ${{ vars.BROWSERSTACK_DEBUG || 'true' }}
          BROWSERSTACK_VIDEO: ${{ vars.BROWSERSTACK_VIDEO || 'true' }}
          BROWSERSTACK_NETWORK_LOGS: ${{ vars.BROWSERSTACK_NETWORK_LOGS || 'true' }}
          DEMO_APP_USERNAME: ${{ secrets.DEMO_APP_USERNAME }}
          DEMO_APP_PASSWORD: ${{ secrets.DEMO_APP_PASSWORD }}
        run: dotnet test AppiumInterviewFramework.sln --configuration Release --no-build --filter Category=Mobile --logger "trx;LogFileName=browserstack-smoke.trx"
      - name: Publish BrowserStack test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-smoke-results
          path: |
            **/TestResults/**
            **/artifacts/**
          if-no-files-found: ignore
